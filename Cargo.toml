[package]
name = "accounting"
version = "0.2.6"
edition = "2024"

[dependencies]
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "migrate", "chrono", "uuid", "rust_decimal"] }
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.91"
chrono = { version = "0.4.41", features = ["serde"] }
jsonwebtoken = "9.3.1"
rust_decimal = { version = "1.37.2", features = ["serde-with-float"] }
serde = { version = "1.0.219", features = ["derive"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
anyhow = "1.0.98"
argon2 = { version = "0.5.3", features = ["rand", "simple"] }
rand_core = { version = "0.9.3", features = ["std"] }
env_logger = "0.11.8"
axum = "0.8.9"
dotenvy = "0.15"
tower-http = { version = "0.6.6", features = ["trace", "cors"] }
tower = "0.5.3"

utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }

[profile.release]
strip = true
lto = true
codegen-units = 1