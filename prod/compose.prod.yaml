services:
  client:
    image: ghcr.io/yolshin195/accounting_client:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_UPSTREAM: api:8888
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [frontend]

  api:
    image: ghcr.io/yolshin195/accountingapi:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [frontend, backend]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - accounting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging
    networks: [backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  accounting_postgres_data: